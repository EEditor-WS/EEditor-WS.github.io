<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEditor WS | Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/head.css">
    <link rel="stylesheet" href="/eelibs/css/!.css">
    <link rel="icon" type="image/x-icon" href="/img/ico/ico.svg">
    <script src="/js/language.js"></script>
    <script src="/js/translator.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/backup.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/head.js"></script>
    <script>
        // Функция для получения параметров из URL
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Обработчик кнопки "Назад"
        function backButton()  {
            const returnPage = getUrlParameter('return');
            if (returnPage) {
                // Проверяем, является ли возвращаемая страница допустимой
                const validPages = ['docs', 'editor', 'events', 'countries'];
                /* if (validPages.includes(returnPage)) {
                    window.location.href = `page/${returnPage}.html`;
                } else {
                    window.location.href = '/index.html';
                } */

                if (returnPage == 'main') {
                    window.location.href = '/index.html';
                } else {
                    window.location.href = `${returnPage}.html`;
                }
            } else {
                window.location.href = '/index.html';
            }
        }
    </script>
    <style>
        .settings-page {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .settings-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .settings-header h2 {
            margin: 0;
            font-weight: 500;
            font-size: 24px;
        }

        .settings-content {
            background: var(--background-secondary);
            padding: 20px;
            border-radius: var(--br);
            border: 1px solid var(--border-color);
        }

        .settings-message {
            text-align: center;
            font-size: 16px;
            margin: 40px 0;
            font-weight: 400;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="settings-page">
        <div class="settings-header">
            <button class="action-button" onclick="backButton()" title="Назад">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h2>Настройки</h2>
        </div>
        <div class="settings-content">
            <div class="settings-message">
                Эта функция находится в разработке
            </div>
            <div class="settings-section">
                <div class="settings-group">
                    <button class="settings-danger-button" id="clearDataBtn"></button>
                </div>
                <h3 data-translate="backup_settings">Настройки бекапов</h3>
                <div class="backup-settings">
                    <div class="backup-interval-setting">
                        <label for="backup-interval" data-translate="backup_interval">Интервал автосохранения (минут):</label>
                        <input type="number" id="backup-interval" value="5" min="1" max="60">
                    </div>
                    <div class="backup-limit-setting">
                        <label for="backup-limit" data-translate="backup_limit">Максимальное количество бекапов:</label>
                        <input type="number" id="backup-limit" value="20" min="1" max="100">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление...</title>
    <script>
        // Получаем текущие параметры строки запроса (например, ?search=book&sort=asc)
        const currentSearchParams = window.location.search;
        
        // Формируем новый URL, добавляя эти параметры к целевой странице
        const targetUrl = '/library.html' + currentSearchParams;
        
        // Выполняем перенаправление (заменяем текущую страницу в истории, 
        // чтобы кнопка "Назад" в браузере не возвращала пользователя на этот редирект)
        window.location.replace(targetUrl);
    </script>
</head>
<body>
    <p>Если перенаправление не произошло автоматически, <a id="redirect-link" href="/library.html">нажмите сюда</a>.</p>
    
    <script>
        // На всякий случай обновляем ссылку для ручного клика, тоже добавляя параметры
        document.getElementById('redirect-link').href = '/library.html' + window.location.search;
    </script>
</body>
</html>
